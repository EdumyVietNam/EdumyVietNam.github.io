<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiểm tra email — EDUMY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS (color_desc.xlsx) ============ */
  :root {
    --primary-50:   #EFF4FF;
    --primary-100:  #DBE8FF;
    --primary-200:  #BFD3FF;
    --primary-300:  #93B4FF;
    --primary-400:  #608CFF;
    --primary-500:  #2558E5;
    --primary-600:  #1D44CD;
    --primary-700:  #1634A1;
    --primary-800:  #122A7F;
    --primary-900:  #0E1F5A;
    --secondary-50: #FFF0ED;
    --secondary-500:#FF6B4A;
    --neutral-0:   #FFFFFF;
    --neutral-50:  #F8FAFC;
    --neutral-100: #F1F5F9;
    --neutral-200: #E2E8F0;
    --neutral-300: #CBD5E1;
    --neutral-400: #94A3B8;
    --neutral-500: #64748B;
    --neutral-600: #475569;
    --neutral-700: #334155;
    --neutral-800: #1E293B;
    --neutral-900: #0F172A;
    --success-500: #10B981;
    --error-500:   #F43F5E;

    --text-primary:  var(--neutral-900);
    --text-secondary:var(--neutral-600);
    --text-tertiary: var(--neutral-500);
    --border-default: var(--neutral-200);
    --surface-hover: var(--neutral-50);
    --font: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(640px 420px at 10% 6%, rgba(219,232,255,0.55), transparent 60%),
      radial-gradient(560px 380px at 92% 14%, rgba(255,224,214,0.5), transparent 55%),
      radial-gradient(560px 420px at 85% 96%, rgba(219,232,255,0.5), transparent 62%),
      var(--neutral-50);
  }
  /* Overlay nền mockup */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(rgba(15,23,42,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,0.035) 1px, transparent 1px);
    background-size: 32px 32px;
    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 40%, transparent 100%);
    mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 40%, transparent 100%);
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: var(--font); cursor: pointer; }

  /* ============ NAVBAR (shared/layout/navbar.html) ============ */
  .navbar { position: sticky; top: 0; z-index: 100; background: var(--neutral-0); border-bottom: 1px solid var(--border-default); }
  .nav-inner { max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; gap: 24px; }
  .nav-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .nav-logo img { height: 34px; width: auto; }
  .nav-logo .brand-name { font-size: 20px; font-weight: 800; letter-spacing: 0.3px; }
  .nav-links { display: flex; align-items: center; gap: 4px; flex: 1; }
  .nav-link { padding: 9px 14px; font-size: 14px; font-weight: 600; color: var(--text-secondary); border-radius: 10px; border: none; background: transparent; transition: color 0.2s, background 0.2s; }
  .nav-link:hover { color: var(--primary-600); background: var(--surface-hover); }
  .nav-link.active { color: var(--primary-600); background: var(--primary-50); }
  .nav-actions { display: flex; align-items: center; gap: 14px; }
  .search-box { position: relative; width: 240px; }
  .search-box input { width: 100%; padding: 10px 14px 10px 40px; font-size: 14px; color: var(--text-primary); background: var(--neutral-50); border: 1.5px solid var(--border-default); border-radius: 10px; outline: none; transition: all 0.2s; }
  .search-box input::placeholder { color: var(--neutral-400); }
  .search-box input:focus { background: var(--neutral-0); border-color: var(--primary-500); box-shadow: 0 0 0 4px var(--primary-50); }
  .search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--neutral-400); }
  .btn-nav { padding: 10px 20px; font-size: 14px; font-weight: 700; color: #fff; background: var(--primary-500); border: 1px solid var(--primary-500); border-radius: 10px; box-shadow: 0 4px 12px rgba(37,88,229,0.28); transition: all 0.2s; }
  .btn-nav:hover { background: var(--primary-400); border-color: var(--primary-400); }
  .hamburger { display: none; background: none; border: none; width: 42px; height: 42px; border-radius: 11px; color: var(--neutral-700); place-items: center; }
  .hamburger:hover { background: var(--neutral-100); }

  /* ============ PAGE / STATE CARD ============ */
  .page { display: flex; justify-content: center; padding: 40px 24px 64px; position: relative; z-index: 1; }
  .state-card {
    width: 100%;
    max-width: 480px;
    background: var(--neutral-0);
    border: 1px solid var(--border-default);
    border-radius: 18px;
    padding: 40px 40px 36px;
    box-shadow: 0 8px 30px rgba(15,23,42,0.06);
    text-align: center;
  }

  .state-icon {
    width: 84px;
    height: 84px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: var(--primary-50);
    border: 1px solid var(--primary-100);
    color: var(--primary-500);
    display: grid;
    place-items: center;
  }

  .state-heading h1 { font-size: 26px; line-height: 1.1; font-weight: 800; margin-bottom: 12px; }
  .state-heading p { font-size: 15px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 16px; }
  .state-heading .email {
    display: inline-block;
    font-weight: 700;
    color: var(--text-primary);
    background: var(--neutral-100);
    border: 1px solid var(--border-default);
    padding: 6px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .state-heading .tip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-tertiary);
  }

  .btn-outline {
    width: 100%;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 700;
    padding: 13px 28px;
    color: var(--primary-600);
    background: var(--neutral-0);
    border: 1.5px solid var(--primary-200);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    margin-top: 28px;
  }
  .btn-outline:hover { background: var(--primary-50); border-color: var(--primary-400); color: var(--primary-500); }
  .btn-outline:active { background: var(--primary-100); border-color: var(--primary-500); }

  .back-hint { text-align: center; font-size: 14px; color: var(--text-secondary); margin-top: 24px; }
  .back-hint a { color: var(--primary-600); font-weight: 700; margin-left: 4px; }
  .back-hint a:hover { text-decoration: underline; }

  /* ============ MOBILE ============ */
  @media (max-width: 900px) {
    .nav-links, .search-box { display: none; }
    .hamburger { display: grid; }
  }
  @media (max-width: 640px) {
    .state-card { padding: 32px 24px 28px; }
  }
</style>
</head>
<body>

  <!-- ============ NAVBAR ============ -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="../../../../index.html" class="nav-logo">
        <img src="../../../../shared/logo/logo-removebg-preview.png" alt="EDUMY logo">
        <span class="brand-name">EDUMY</span>
      </a>
      <nav class="nav-links">
        <a href="#" class="nav-link">Trang chủ</a>
        <a href="#" class="nav-link">Khóa học</a>
        <a href="#" class="nav-link">Bài thi</a>
        <a href="#" class="nav-link">Giảng viên</a>
        <a href="#" class="nav-link">Blog</a>
      </nav>
      <div class="nav-actions">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" placeholder="Tìm kiếm khóa học...">
        </div>
        <a href="../../Login/login.html" class="btn-nav">Đăng nhập</a>
        <button class="hamburger" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ CHECK EMAIL STATE ============ -->
  <main class="page">
    <div class="state-card">

      <div class="state-icon">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7L22 7"/></svg>
      </div>

      <div class="state-heading">
        <h1>Kiểm tra email của bạn</h1>
        <p>Chúng tôi đã gửi link đặt lại mật khẩu đến địa chỉ email:</p>
        <span class="email">edumyuser@gmail.com</span>
        <p class="tip">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          Nếu không thấy email, hãy kiểm tra thư mục Spam.
        </p>
      </div>

      <button type="button" class="btn-outline">Gửi lại email</button>

      <p class="back-hint">Bạn nhớ ra mật khẩu?<a href="../../Login/login.html">Quay lại đăng nhập</a></p>

    </div>
  </main>

</body>
</html>
