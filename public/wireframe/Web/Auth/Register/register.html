<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — EDUMY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS (color_desc.xlsx) ============ */
  :root {
    --primary-50:   #EFF4FF;
    --primary-100:  #DBE8FF;
    --primary-200:  #BFD3FF;
    --primary-300:  #93B4FF;
    --primary-400:  #608CFF;
    --primary-500:  #2558E5;
    --primary-600:  #1D44CD;
    --primary-700:  #1634A1;
    --primary-800:  #122A7F;
    --primary-900:  #0E1F5A;
    --secondary-50: #FFF0ED;
    --secondary-500:#FF6B4A;
    --neutral-0:   #FFFFFF;
    --neutral-50:  #F8FAFC;
    --neutral-100: #F1F5F9;
    --neutral-200: #E2E8F0;
    --neutral-300: #CBD5E1;
    --neutral-400: #94A3B8;
    --neutral-500: #64748B;
    --neutral-600: #475569;
    --neutral-700: #334155;
    --neutral-800: #1E293B;
    --neutral-900: #0F172A;
    --error-500:   #F43F5E;

    --text-primary:  var(--neutral-900);
    --text-secondary:var(--neutral-600);
    --text-tertiary: var(--neutral-500);
    --border-default: var(--neutral-200);
    --surface-hover: var(--neutral-50);
    --font: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(640px 420px at 10% 6%, rgba(219,232,255,0.55), transparent 60%),
      radial-gradient(560px 380px at 92% 14%, rgba(255,224,214,0.5), transparent 55%),
      radial-gradient(560px 420px at 85% 96%, rgba(219,232,255,0.5), transparent 62%),
      var(--neutral-50);
  }
  /* Overlay nền mockup */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(rgba(15,23,42,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,0.035) 1px, transparent 1px);
    background-size: 32px 32px;
    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 40%, transparent 100%);
    mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 40%, transparent 100%);
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: var(--font); cursor: pointer; }
  input, select { font-family: var(--font); }

  /* ============ NAVBAR (shared/layout/navbar.html) ============ */
  .navbar { position: sticky; top: 0; z-index: 100; background: var(--neutral-0); border-bottom: 1px solid var(--border-default); }
  .nav-inner { max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; gap: 24px; }
  .nav-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .nav-logo img { height: 34px; width: auto; }
  .nav-logo .brand-name { font-size: 20px; font-weight: 800; letter-spacing: 0.3px; }
  .nav-links { display: flex; align-items: center; gap: 4px; flex: 1; }
  .nav-link { padding: 9px 14px; font-size: 14px; font-weight: 600; color: var(--text-secondary); border-radius: 10px; border: none; background: transparent; transition: color 0.2s, background 0.2s; }
  .nav-link:hover { color: var(--primary-600); background: var(--surface-hover); }
  .nav-link.active { color: var(--primary-600); background: var(--primary-50); }
  .nav-actions { display: flex; align-items: center; gap: 14px; }
  .search-box { position: relative; width: 240px; }
  .search-box input { width: 100%; padding: 10px 14px 10px 40px; font-size: 14px; color: var(--text-primary); background: var(--neutral-50); border: 1.5px solid var(--border-default); border-radius: 10px; outline: none; transition: all 0.2s; }
  .search-box input::placeholder { color: var(--neutral-400); }
  .search-box input:focus { background: var(--neutral-0); border-color: var(--primary-500); box-shadow: 0 0 0 4px var(--primary-50); }
  .search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--neutral-400); }
  .btn-nav { padding: 10px 20px; font-size: 14px; font-weight: 700; color: #fff; background: var(--primary-500); border: 1px solid var(--primary-500); border-radius: 10px; box-shadow: 0 4px 12px rgba(37,88,229,0.28); transition: all 0.2s; }
  .btn-nav:hover { background: var(--primary-400); border-color: var(--primary-400); }
  .hamburger { display: none; background: none; border: none; width: 42px; height: 42px; border-radius: 11px; color: var(--neutral-700); place-items: center; }
  .hamburger:hover { background: var(--neutral-100); }

  /* ============ PAGE / REGISTER CARD ============ */
  .page { display: flex; justify-content: center; padding: 40px 24px 64px; position: relative; z-index: 1; }
  .register-card {
    width: 100%;
    max-width: 560px;
    background: var(--neutral-0);
    border: 1px solid var(--border-default);
    border-radius: 18px;
    padding: 36px 40px;
    box-shadow: 0 8px 30px rgba(15,23,42,0.06);
  }

  .form-heading { margin-bottom: 28px; }
  .form-heading h1 { font-size: 28px; line-height: 1.1; font-weight: 800; margin-bottom: 8px; }
  .form-heading p { font-size: 15px; line-height: 1.6; color: var(--text-secondary); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 14px; font-weight: 600; color: var(--neutral-700); margin-bottom: 8px; }
  .field label .required { color: var(--error-500); }

  .input-wrap { position: relative; }
  .input-wrap .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--neutral-400); display: grid; place-items: center; pointer-events: none; }
  .input-wrap input, .input-wrap select {
    width: 100%;
    padding: 12px 16px 12px 44px;
    font-size: 15px;
    color: var(--text-primary);
    background: var(--neutral-0);
    border: 1.5px solid var(--border-default);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrap input::placeholder { color: var(--neutral-400); }
  .input-wrap input:hover { border-color: var(--neutral-300); }
  .input-wrap input:focus { border-color: var(--primary-500); box-shadow: 0 0 0 4px var(--primary-50); }

  /* Select */
  .input-wrap select { appearance: none; -webkit-appearance: none; padding-right: 40px; cursor: pointer; background: var(--neutral-0); }
  .input-wrap select:focus { border-color: var(--primary-500); box-shadow: 0 0 0 4px var(--primary-50); }
  .input-wrap .chevron { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--neutral-400); pointer-events: none; display: grid; place-items: center; }

  /* Password toggle */
  .input-wrap .toggle-eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: none; background: transparent; color: var(--neutral-400); border-radius: 8px; display: grid; place-items: center; transition: color 0.2s, background 0.2s; }
  .input-wrap .toggle-eye:hover { color: var(--primary-600); background: var(--neutral-100); }

  /* Terms */
  .terms { display: flex; align-items: flex-start; gap: 10px; margin: 4px 0 24px; cursor: pointer; }
  .terms input { width: 17px; height: 17px; accent-color: var(--primary-500); margin-top: 2px; cursor: pointer; flex-shrink: 0; }
  .terms span { font-size: 13px; color: var(--neutral-600); line-height: 1.6; }
  .terms a { color: var(--primary-600); font-weight: 600; }
  .terms a:hover { text-decoration: underline; }

  .btn-primary { width: 100%; font-size: 15px; font-weight: 700; padding: 13px 28px; color: #fff; background: var(--primary-500); border: 1px solid var(--primary-500); border-radius: 12px; box-shadow: 0 4px 14px rgba(37,88,229,0.30); transition: all 0.2s; }
  .btn-primary:hover { background: var(--primary-400); border-color: var(--primary-400); box-shadow: 0 8px 20px rgba(37,88,229,0.38); }
  .btn-primary:active { background: var(--primary-600); border-color: var(--primary-600); box-shadow: 0 2px 8px rgba(37,88,229,0.30); }

  .login-hint { text-align: center; font-size: 14px; color: var(--text-secondary); }
  .login-hint a { color: var(--primary-600); font-weight: 700; margin-left: 4px; }
  .login-hint a:hover { text-decoration: underline; }

  /* ============ MOBILE ============ */
  @media (max-width: 900px) {
    .nav-links, .search-box { display: none; }
    .hamburger { display: grid; }
  }
  @media (max-width: 640px) {
    .register-card { padding: 28px 20px; }
    .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <!-- ============ NAVBAR ============ -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="../../../index.html" class="nav-logo">
        <img src="../../../shared/logo/logo-removebg-preview.png" alt="EDUMY logo">
        <span class="brand-name">EDUMY</span>
      </a>
      <nav class="nav-links">
        <a href="#" class="nav-link">Trang chủ</a>
        <a href="#" class="nav-link">Khóa học</a>
        <a href="#" class="nav-link">Bài thi</a>
        <a href="#" class="nav-link">Giảng viên</a>
        <a href="#" class="nav-link">Blog</a>
      </nav>
      <div class="nav-actions">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" placeholder="Tìm kiếm khóa học...">
        </div>
        <a href="../Login/login.html" class="btn-nav">Đăng nhập</a>
        <button class="hamburger" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ REGISTER FORM ============ -->
  <main class="page">
    <div class="register-card">

      <div class="form-heading">
        <h1>Đăng ký tài khoản</h1>
        <p>Tạo tài khoản EDUMY để bắt đầu hành trình học tập của bạn.</p>
      </div>

      <form action="#" method="post" novalidate>

        <!-- Họ & Tên -->
        <div class="grid-2">
          <div class="field">
            <label for="lastname">Họ <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input type="text" id="lastname" name="lastname" placeholder="Nguyễn">
            </div>
          </div>
          <div class="field">
            <label for="firstname">Tên <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input type="text" id="firstname" name="firstname" placeholder="Minh Anh">
            </div>
          </div>
        </div>

        <!-- Email -->
        <div class="field">
          <label for="email">Email <span class="required">*</span></label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
            </span>
            <input type="email" id="email" name="email" placeholder="banquangnhathung2005@gmail.com" autocomplete="email">
          </div>
        </div>

        <!-- Mật khẩu & Xác nhận -->
        <div class="grid-2">
          <div class="field">
            <label for="password">Mật khẩu <span class="required">*</span></label>
            <div class="input-wrap">
              <input type="password" id="password" name="password" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" style="padding-left:16px;">
              <button type="button" class="toggle-eye" aria-label="Hiện mật khẩu">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="confirm">Xác nhận mật khẩu <span class="required">*</span></label>
            <div class="input-wrap">
              <input type="password" id="confirm" name="confirm" placeholder="Nhập lại mật khẩu" autocomplete="new-password" style="padding-left:16px;">
              <button type="button" class="toggle-eye" aria-label="Hiện mật khẩu">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Ngày sinh & Giới tính -->
        <div class="grid-2">
          <div class="field">
            <label for="dob">Ngày sinh <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </span>
              <input type="date" id="dob" name="dob">
            </div>
          </div>
          <div class="field">
            <label for="gender">Giới tính <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
              </span>
              <select id="gender" name="gender">
                <option value="" selected disabled hidden>Chọn giới tính</option>
                <option>Nam</option>
                <option>Nữ</option>
                <option>Khác</option>
              </select>
              <span class="chevron">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </span>
            </div>
          </div>
        </div>

        <!-- Địa chỉ: Tỉnh/Thành phố, Xã/Phường -->
        <div class="grid-2">
          <div class="field">
            <label for="province">Tỉnh / Thành phố <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
              </span>
              <select id="province" name="province">
                <option value="" selected disabled hidden>Chọn tỉnh / thành phố</option>
                <option>TP. Hồ Chí Minh</option>
                <option>Hà Nội</option>
                <option>Đà Nẵng</option>
                <option>Hải Phòng</option>
                <option>Cần Thơ</option>
                <option>An Giang</option>
              </select>
              <span class="chevron">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </span>
            </div>
          </div>
          <div class="field">
            <label for="district">Xã / Phường <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
              </span>
              <select id="district" name="district">
                <option value="" selected disabled hidden>Chọn xã / phường</option>
                <option>Phường 1</option>
                <option>Phường 7</option>
                <option>Phường 10</option>
                <option>Phường Thủ Đức</option>
                <option>Xã Bình Chánh</option>
              </select>
              <span class="chevron">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </span>
            </div>
          </div>
        </div>

        <!-- Địa chỉ chi tiết -->
        <div class="field">
          <label for="address">Địa chỉ</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            </span>
            <input type="text" id="address" name="address" placeholder="Số nhà, tên đường, khu phố...">
          </div>
        </div>

        <!-- Terms -->
        <label class="terms">
          <input type="checkbox" name="agree">
          <span>Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a> và <a href="#">Chính sách bảo mật</a> của EDUMY.</span>
        </label>

        <button type="submit" class="btn-primary">Đăng ký</button>
      </form>

      <div class="login-hint" style="margin-top:24px;">Đã có tài khoản?<a href="../Login/login.html">Đăng nhập</a></div>

    </div>
  </main>

</body>
</html>
