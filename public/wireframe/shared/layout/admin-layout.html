<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUMY — Admin Layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS ============ */
  :root {
    --primary-50:#EFF4FF; --primary-100:#DBE8FF; --primary-200:#BFD3FF;
    --primary-300:#93B4FF; --primary-400:#608CFF; --primary-500:#2558E5;
    --primary-600:#1D44CD; --primary-700:#1634A1; --primary-800:#122A7F; --primary-900:#0E1F5A;
    --secondary-50:#FFF0ED; --secondary-500:#FF6B4A; --secondary-600:#E65132;
    --neutral-0:#FFFFFF; --neutral-50:#F8FAFC; --neutral-100:#F1F5F9; --neutral-200:#E2E8F0;
    --neutral-300:#CBD5E1; --neutral-400:#94A3B8; --neutral-500:#64748B; --neutral-600:#475569;
    --neutral-700:#334155; --neutral-800:#1E293B; --neutral-900:#0F172A;
    --text-primary: var(--neutral-900);
    --text-secondary: var(--neutral-600);
    --text-tertiary: var(--neutral-500);
    --border-default: var(--neutral-200);
    --shadow-nav: 0 1px 0 var(--border-default), 0 4px 24px rgba(15,23,42,0.06);
    --font: 'Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--neutral-50); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }
  button { font-family: var(--font); cursor: pointer; }

  .admin { display: flex; min-height: 100vh; }

  /* ============ SIDEBAR (Primary 900) ============ */
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 264px;
    background: linear-gradient(180deg, var(--primary-900), var(--primary-800));
    color: rgba(255,255,255,0.82);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 90;
  }
  .sidebar-brand { display: flex; align-items: center; gap: 11px; padding: 20px 22px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
  .sidebar-brand img { height: 32px; width: auto; }
  .sidebar-brand .name { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: 0.3px; }
  .sidebar-brand .role { font-size: 10px; font-weight: 600; color: var(--primary-200); text-transform: uppercase; letter-spacing: 1px; }

  .sidebar-nav { flex: 1; padding: 14px 12px; }
  .nav-label { padding: 18px 14px 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(255,255,255,0.38); }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin: 2px 0; border-radius: 10px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.78); transition: background .2s, color .2s; }
  .nav-item svg { flex-shrink: 0; color: rgba(255,255,255,0.6); transition: color .2s; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item:hover svg { color: #fff; }
  .nav-item.active { background: var(--primary-500); color: #fff; box-shadow: 0 6px 16px rgba(37,88,229,0.35); }
  .nav-item.active svg { color: #fff; }

  .sidebar-foot { padding: 14px 12px; border-top: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
  .sidebar-user { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
  .sidebar-user .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--secondary-500), var(--secondary-600)); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
  .sidebar-user .meta { font-size: 13px; font-weight: 600; color: #fff; }
  .sidebar-user .meta small { display: block; font-weight: 400; font-size: 12px; color: rgba(255,255,255,0.5); }

  /* ============ SIDEBAR COLLAPSE (desktop) ============ */
  .admin.collapsed .sidebar { width: 76px; }
  .admin.collapsed .admin-main { margin-left: 76px; }
  .admin.collapsed .sidebar-brand .text,
  .admin.collapsed .nav-label,
  .admin.collapsed .nav-item span,
  .admin.collapsed .sidebar-user .meta { display: none; }
  .admin.collapsed .nav-item { justify-content: center; padding: 10px 0; }

  /* ============ MAIN ============ */
  .admin-main { margin-left: 264px; flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: 0; z-index: 50;
    height: 68px; background: var(--neutral-0);
    border-bottom: 1px solid var(--border-default);
    display: flex; align-items: center; gap: 16px; padding: 0 24px;
    box-shadow: 0 1px 0 var(--border-default);
    flex-shrink: 0;
  }
  .topbar .hamburger { background: none; border: none; width: 40px; height: 40px; border-radius: 10px; color: var(--neutral-700); place-items: center; display: grid; }
  .topbar .hamburger:hover { background: var(--neutral-100); }
  .tb-title { font-size: 16px; font-weight: 700; }
  .tb-search { position: relative; margin-left: auto; width: 220px; }
  .tb-search input { width: 100%; padding: 9px 14px 9px 38px; font-size: 14px; background: var(--neutral-50); border: 1.5px solid var(--border-default); border-radius: 10px; outline: none; transition: all .2s; }
  .tb-search input::placeholder { color: var(--neutral-400); }
  .tb-search input:focus { background: var(--neutral-0); border-color: var(--primary-500); box-shadow: 0 0 0 4px var(--primary-50); }
  .tb-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--neutral-400); }
  .tb-icon { position: relative; width: 42px; height: 42px; border-radius: 11px; background: var(--neutral-50); border: none; color: var(--neutral-600); display: grid; place-items: center; transition: background .2s,color .2s; }
  .tb-icon:hover { background: var(--primary-50); color: var(--primary-600); }
  .tb-avatar { display: flex; align-items: center; gap: 10px; padding: 5px 10px 5px 5px; border-radius: 999px; border: 1.5px solid var(--border-default); background: var(--neutral-0); }
  .tb-avatar .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-500), var(--primary-700)); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .tb-avatar .meta { font-size: 13px; font-weight: 600; }
  .tb-avatar .meta small { display: block; font-weight: 400; color: var(--neutral-400); font-size: 12px; }

  /* ============ CONTENT (area dành cho nội dung trang) ============ */
  .content { padding: 28px; flex: 1; }
  .content-placeholder {
    height: 100%;
    min-height: 480px;
    border: 1.5px dashed var(--neutral-300);
    border-radius: 14px;
    display: grid;
    place-items: center;
    color: var(--neutral-400);
    font-size: 15px;
    background: var(--neutral-0);
  }

  /* ============ MOBILE ============ */
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .admin-main { margin-left: 0; }
    .tb-search { display: none; }
  }
</style>
</head>
<body>

<div class="admin">

  <!-- ============ SIDEBAR ============ -->

      <div class="sidebar-user">
        <span class="avatar">NH</span>
        <div class="meta">Nhật Hưng <small>Quản trị viên</small></div>

  </aside>

  <!-- ============ MAIN ============ -->
  <div class="admin-main">

      <button class="hamburger" aria-label="Thu gọn menu">

    <!-- ============ CONTENT: vùng dành cho nội dung từng trang ============ -->
